[project]
name = "spilltrace-backend"
version = "0.1.0"
description = "OASIS API — oil-spill detection, drift hindcast/forecast and AIS vessel attribution"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "rasterio>=1.3",
    "shapely>=2.0",
    "xarray>=2024.6",
    "netCDF4>=1.7",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "reportlab>=4.2",
    "scikit-learn>=1.5",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
